name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ttt_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy pytest-asyncio httpx

      - name: Run Linting
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/ttt_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: testsecret
        run: |
          pytest tests/

      - name: Build Docker Image
        run: |
          docker build -t ttt-arena .
